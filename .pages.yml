# Pages CMS (https://pagescms.org), modeled on github.com/pagescms/nextjs-blog-template.
# Posts fields mirror src/lib/posts.ts; dates stay YYYY-MM-DD because parsePost requires it.
media:
  input: public/assets
  output: /assets
  categories: ["image"]
content:
  - name: posts
    label: Posts
    type: collection
    path: _posts
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: title
      fields: [title, date, draft]
      sort: date
      order: desc
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: date, label: Date, type: date, required: true, options: { format: "yyyy-MM-dd" } }
      - { name: summary, label: Summary, type: text, required: true }
      - { name: draft, label: Draft, type: boolean, description: "Hidden outside pnpm dev" }
      - { name: body, label: Body, type: rich-text, options: { format: markdown } }
  - name: repository-drafts
    label: Archived repository drafts
    type: collection
    path: docs/editorial/repository-drafts
    format: yaml-frontmatter
    exclude: [README.md]
    view:
      primary: title
      fields: [title, date]
      sort: date
      order: desc
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: date, label: Date, type: date, options: { format: "yyyy-MM-dd" } }
      - { name: summary, label: Summary, type: text }
      - { name: draft, label: Draft, type: boolean }
      - { name: reviewed, label: Reviewed, type: date, options: { format: "yyyy-MM-dd" } }
      - { name: date_basis, label: Date basis, type: string }
      - { name: repository, label: Repository, type: string }
      - { name: body, label: Body, type: rich-text, options: { format: markdown } }
